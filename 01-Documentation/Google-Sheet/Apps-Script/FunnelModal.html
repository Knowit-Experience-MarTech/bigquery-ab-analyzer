<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Arial', sans-serif; padding: 15px; color: #333; background-color: #f8f9fa; }
    h3 { margin-top: 0; font-size: 16px; color: #1a73e8; border-bottom: 2px solid #e8eaed; padding-bottom: 10px;}
    
    .step-card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 12px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .step-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold;}
    
    .input-group { margin-bottom: 8px; }
    
    /* NEW: Flexbox row for side-by-side elements */
    .flex-row { display: flex; gap: 12px; margin-bottom: 8px; }
    .flex-row .input-group { flex: 1; margin-bottom: 0; } 
    
    label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #5f6368; }
    input[type="text"], input[type="number"], select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #dadce0; border-radius: 4px; font-size: 13px; }
    input:disabled, select:disabled { background-color: #f1f3f4; color: #9aa0a6; }
    
    .filter-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 12px 0 8px 0; }
    
    button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; font-size: 13px; }
    .btn-remove { background: transparent; color: #d93025; padding: 4px; }
    .btn-remove:hover { background: #fce8e6; }
    .btn-add { background: #f1f3f4; color: #1a73e8; width: 100%; padding: 10px; margin-bottom: 20px; border: 1px dashed #1a73e8; }
    .btn-add:hover { background: #e8f0fe; }
    .btn-save { background: #1a73e8; color: #fff; width: 100%; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .btn-save:hover { background: #1557b0; }
    .btn-save:disabled { background: #8ab4f8; cursor: not-allowed; }
  </style>
</head>
<body>

  <h3>Experiment: <?= experimentId ?></h3>
  
  <div id="editor">
    <div id="steps-container"></div>
    <button class="btn-add" onclick="addStep()">+ Add Funnel Step</button>
    <button class="btn-save" id="save-btn" onclick="saveData()">Save Funnel</button>
  </div>

  <script>
    const expId = <?!= JSON.stringify(experimentId) ?>;
    let state = <?!= JSON.stringify(funnelData) ?>;

    window.onload = function() {
      renderSteps();
    };

    function renderSteps() {
      const container = document.getElementById('steps-container');
      container.innerHTML = ''; 

      state.steps.forEach((step, index) => {
        const card = document.createElement('div');
        card.className = 'step-card';
        
        const variantOptions = ['Both', 'A', 'B'].map(v => `<option value="${v}" ${step.variant === v ? 'selected' : ''}>${v}</option>`).join('');
        const eventOptions = ['<option value="">-- Select Event --</option>'].concat(state.events.map(e => `<option value="${e}" ${step.eventName === e ? 'selected' : ''}>${e}</option>`)).join('');
        const fieldOptions = ['<option value="">-- Select Field --</option>'].concat(state.filterFields.map(f => `<option value="${f}" ${step.filterField === f ? 'selected' : ''}>${f}</option>`)).join('');

        card.innerHTML = `
          <div class="step-header">
            <span>Step <input type="number" value="${step.stepNum}" onchange="updateStep(${index}, 'stepNum', this.value)" style="width: 50px; display: inline-block; margin-left: 5px;"></span>
            <button class="btn-remove" onclick="removeStep(${index})">Delete</button>
          </div>
          
          <!-- NEW: Wrapped Variant and Event Name in the flex-row container -->
          <div class="flex-row">
            <div class="input-group">
              <label>Variant</label>
              <select onchange="updateStep(${index}, 'variant', this.value)">${variantOptions}</select>
            </div>
            
            <div class="input-group">
              <label>Event Name</label>
              <select id="event-select-${index}" onchange="updateStep(${index}, 'eventName', this.value)">${eventOptions}</select>
            </div>
          </div>

          <div class="filter-toggle">
            <input type="checkbox" id="chk-${index}" ${step.filterOn ? 'checked' : ''} onchange="toggleFilter(${index}, this.checked)">
            <label for="chk-${index}" style="margin:0; cursor:pointer;">Apply Event Filter</label>
          </div>

          <div id="filter-group-${index}" style="display: ${step.filterOn ? 'block' : 'none'};">
            <div class="input-group">
              <label>Filter Field</label>
              <select id="filter-select-${index}" onchange="updateStep(${index}, 'filterField', this.value)">${fieldOptions}</select>
            </div>
            <div class="input-group">
              <label>Filter Value (RegEx Contains)</label>
              <input type="text" value="${step.filterValue || ''}" onchange="updateStep(${index}, 'filterValue', this.value)" placeholder="e.g. /checkout$">
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateStep(index, key, value) {
      state.steps[index][key] = value;
    }

    function toggleFilter(index, isChecked) {
      state.steps[index].filterOn = isChecked;
      if (!isChecked) {
        state.steps[index].filterField = "";
        state.steps[index].filterValue = "";
      }
      renderSteps(); 
    }

    function addStep() {
      const maxStep = state.steps.reduce((max, step) => Math.max(max, parseInt(step.stepNum) || 0), 0);
      state.steps.push({
        stepNum: maxStep + 1,
        variant: "Both",
        eventName: "",
        filterOn: false,
        filterField: "",
        filterValue: ""
      });
      renderSteps();
    }

    function removeStep(index) {
      state.steps.splice(index, 1);
      renderSteps();
    }

    function saveData() {
      let isValid = true;
      let errorMessages = [];

      // 1. Validate all steps before saving
      state.steps.forEach((step, index) => {
        const eventDropdown = document.getElementById(`event-select-${index}`);
        const filterDropdown = document.getElementById(`filter-select-${index}`);
        
        // Reset styles to default first
        if (eventDropdown) {
          eventDropdown.style.borderColor = "#dadce0";
          eventDropdown.style.backgroundColor = "#fff";
        }
        if (filterDropdown) {
          filterDropdown.style.borderColor = "#dadce0";
          filterDropdown.style.backgroundColor = "#fff";
        }

        // Check 1: Missing Event Name
        if (!step.eventName || step.eventName.trim() === "") {
          isValid = false;
          errorMessages.push(`Step ${step.stepNum}: Missing Event Name`);
          if (eventDropdown) {
            eventDropdown.style.borderColor = "#d93025"; 
            eventDropdown.style.backgroundColor = "#fce8e6"; 
          }
        }

        // Check 2: Filter is checked, but no Filter Field is selected
        if (step.filterOn && (!step.filterField || step.filterField.trim() === "")) {
          isValid = false;
          errorMessages.push(`Step ${step.stepNum}: Missing Filter Field`);
          if (filterDropdown) {
            filterDropdown.style.borderColor = "#d93025"; 
            filterDropdown.style.backgroundColor = "#fce8e6"; 
          }
        }
      });

      // 2. Stop the save if validation failed and show exactly what broke
      if (!isValid) {
        alert("Hold up! Please fix the following errors:\n\n" + errorMessages.join("\n"));
        return; 
      }

      // 3. Proceed with saving if everything is valid
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.innerText = "Saving...";

      google.script.run
        .withSuccessHandler(function() {
          btn.innerText = "Saved!";
          setTimeout(() => { btn.innerText = "Save Funnel"; btn.disabled = false; }, 2000);
        })
        .saveFunnelModalData(expId, state.steps);
    }
  </script>
</body>
</html>
